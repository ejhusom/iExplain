openapi: 3.1.0
info:
  title: iExplain
  description: Async API for submitting iExplain runs, polling results, and reusing
    session defaults. The OpenAPI schema is available at `/openapi.json`, with interactive
    docs at `/docs` and `/redoc`.
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Service health
      description: Return a lightweight health response plus the currently available
        profiles and skills.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/catalog:
    get:
      tags:
      - health
      summary: Runtime catalog
      description: Return the resolved runtime catalog, including profiles, prompts,
        skills, pipelines, tools, and server configuration.
      operationId: getCatalog
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
  /api/v1/jobs:
    get:
      tags:
      - jobs
      summary: List jobs
      description: List submitted jobs in reverse chronological order.
      operationId: listJobs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobSummaryResponse'
                type: array
                title: Response Listjobs
    post:
      tags:
      - jobs
      summary: Submit job
      description: Submit one asynchronous run request and receive a job identifier
        for polling.
      operationId: submitJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get job
      description: Fetch the current state of a submitted job, including the final
        result when available.
      operationId: getJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions:
    get:
      tags:
      - sessions
      summary: List sessions
      description: List persisted sessions in reverse chronological order.
      operationId: listSessions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionResponse'
                type: array
                title: Response Listsessions
    post:
      tags:
      - sessions
      summary: Create session
      description: Create a session that stores default profile, overrides, and metadata
        for future task submissions.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Get session
      description: Fetch one session and its currently stored defaults.
      operationId: getSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - sessions
      summary: Update session
      description: Merge updated defaults into an existing session.
      operationId: updateSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - sessions
      summary: Delete session
      description: Delete a persisted session record.
      operationId: deleteSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/jobs:
    get:
      tags:
      - sessions
      summary: List session jobs
      description: List jobs created from a specific session.
      operationId: listSessionJobs
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobSummaryResponse'
                title: Response Listsessionjobs
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/tasks:
    post:
      tags:
      - sessions
      summary: Submit session task
      description: Submit one task using a session's stored defaults and receive a
        job identifier for polling.
      operationId: submitSessionTask
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTaskRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inspector/context:
    get:
      tags:
      - inspector
      summary: Inspector context
      description: Return inspector-oriented context such as available profiles and
        storage directories.
      operationId: getInspectorContext
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectorContextResponse'
  /api/v1/inspector/runs:
    get:
      tags:
      - inspector
      summary: List runs
      description: List persisted evaluation runs that have a summary.json file.
      operationId: listInspectorRuns
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InspectorRunSummaryResponse'
                type: array
                title: Response Listinspectorruns
  /api/v1/inspector/runs/{run_id}:
    get:
      tags:
      - inspector
      summary: Get run
      description: Return the stored summary, experiment payload, and a preview of
        results for one evaluation run.
      operationId: getInspectorRun
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectorRunDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inspector/runs/{run_id}/cases/{case_id}:
    get:
      tags:
      - inspector
      summary: Get run case
      description: Return one archived case row from results.jsonl, including the
        full runtime trace when present.
      operationId: getInspectorRunCase
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectorRunCaseDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ArtifactInput:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
          description: Artifact filename relative to the temporary workspace created
            for the run.
          examples:
          - session.log
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Inline text content to write to the workspace before the run
            starts.
          examples:
          - '081111 061856 34 INFO dfs.FSNamesystem: BLOCK* NameSystem.allocateBlock:
            /tmp/x blk_1'
        source_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Path
          description: Server-local filesystem path to copy into the workspace. This
            is resolved on the API server, not uploaded by the client.
          examples:
          - /var/data/logs/session.log
      type: object
      required:
      - name
      title: ArtifactInput
      example:
        content: '081111 061856 34 INFO dfs.FSNamesystem: BLOCK* NameSystem.allocateBlock:
          /tmp/x blk_1'
        name: session.log
    CatalogApiConfigResponse:
      properties:
        host:
          type: string
          title: Host
          description: Bind host configured for the API server.
        port:
          type: integer
          title: Port
          description: Bind port configured for the API server.
        max_workers:
          type: integer
          title: Max Workers
          description: Maximum concurrent background job workers.
      type: object
      required:
      - host
      - port
      - max_workers
      title: CatalogApiConfigResponse
    CatalogConfigResponse:
      properties:
        profiles:
          additionalProperties:
            $ref: '#/components/schemas/CatalogProfileResponse'
          type: object
          title: Profiles
          description: Named runtime profiles available on the server.
        model:
          $ref: '#/components/schemas/CatalogModelResponse'
          description: Default model configuration.
        api:
          $ref: '#/components/schemas/CatalogApiConfigResponse'
          description: API server configuration.
        paths:
          $ref: '#/components/schemas/CatalogPathsResponse'
          description: Resolved server-local filesystem paths.
      type: object
      required:
      - model
      - api
      - paths
      title: CatalogConfigResponse
    CatalogModelResponse:
      properties:
        provider:
          type: string
          title: Provider
          description: Default model provider configured for the service.
        model:
          type: string
          title: Model
          description: Default model name configured for the service.
        temperature:
          type: number
          title: Temperature
          description: Default temperature configured for the service.
        max_tokens:
          type: integer
          title: Max Tokens
          description: Default output token limit configured for the service.
        timeout_seconds:
          type: integer
          title: Timeout Seconds
          description: Model request timeout configured for the service.
      type: object
      required:
      - provider
      - model
      - temperature
      - max_tokens
      - timeout_seconds
      title: CatalogModelResponse
    CatalogPathsResponse:
      properties:
        prompts_dir:
          type: string
          title: Prompts Dir
          description: Server-local prompts directory.
        skills_dir:
          type: string
          title: Skills Dir
          description: Server-local skills directory.
        runs_dir:
          type: string
          title: Runs Dir
          description: Server-local run storage directory.
        workspace_root:
          type: string
          title: Workspace Root
          description: Server-local root used for temporary run workspaces.
      type: object
      required:
      - prompts_dir
      - skills_dir
      - runs_dir
      - workspace_root
      title: CatalogPathsResponse
    CatalogProfileResponse:
      properties:
        mode:
          $ref: '#/components/schemas/ExecutionMode'
          description: Execution mode configured for the profile.
        pipeline:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline
          description: Pipeline used by the profile when mode is `pipeline`.
        tools:
          items:
            type: string
          type: array
          title: Tools
          description: Allowed tools for the profile.
        skills:
          items:
            type: string
          type: array
          title: Skills
          description: Active skills for the profile.
        prompt_overrides:
          additionalProperties:
            type: string
          type: object
          title: Prompt Overrides
          description: Prompt role to prompt variant mapping configured for the profile.
        max_turns:
          type: integer
          title: Max Turns
          description: Maximum assistant turns allowed for the profile.
        max_delegations:
          type: integer
          title: Max Delegations
          description: Maximum delegations allowed in planner mode.
      type: object
      required:
      - mode
      - max_turns
      - max_delegations
      title: CatalogProfileResponse
    CatalogResponse:
      properties:
        config:
          $ref: '#/components/schemas/CatalogConfigResponse'
          description: Resolved server configuration and profile catalog.
        prompts:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Prompts
          description: Available prompt variants grouped by prompt role.
        skills:
          additionalProperties:
            $ref: '#/components/schemas/CatalogSkillResponse'
          type: object
          title: Skills
          description: Available skills keyed by skill identifier.
        pipelines:
          items:
            type: string
          type: array
          title: Pipelines
          description: Available pipeline identifiers.
        tools:
          items:
            type: string
          type: array
          title: Tools
          description: Available tool identifiers.
      type: object
      required:
      - config
      title: CatalogResponse
    CatalogSkillResponse:
      properties:
        name:
          type: string
          title: Name
          description: Human-readable skill name.
        path:
          type: string
          title: Path
          description: Server-local path to the skill file.
        description:
          type: string
          title: Description
          description: Short skill summary.
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
          description: Skill metadata parsed from frontmatter.
      type: object
      required:
      - name
      - path
      - description
      title: CatalogSkillResponse
    ExecutionMode:
      type: string
      enum:
      - pipeline
      - agent
      - planner
      title: ExecutionMode
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Static service health indicator.
          default: ok
        profiles:
          items:
            type: string
          type: array
          title: Profiles
          description: Available runtime profiles from the current server configuration.
        skills:
          items:
            type: string
          type: array
          title: Skills
          description: Available skill identifiers discovered on the server.
      type: object
      title: HealthResponse
      example:
        profiles:
        - default
        - intent_demo
        skills:
        - generic-log-analysis
        - hdfs-anomaly-analysis
        status: ok
    InspectorContextResponse:
      properties:
        profiles:
          items:
            type: string
          type: array
          title: Profiles
          description: Available profiles shown in the inspector UI.
        runs_dir:
          type: string
          title: Runs Dir
          description: Server-local directory containing evaluation runs.
        jobs_dir:
          type: string
          title: Jobs Dir
          description: Server-local directory containing persisted API jobs.
        sessions_dir:
          type: string
          title: Sessions Dir
          description: Server-local directory containing persisted API sessions.
      type: object
      required:
      - runs_dir
      - jobs_dir
      - sessions_dir
      title: InspectorContextResponse
    InspectorRunCaseDetailResponse:
      properties:
        run_id:
          type: string
          title: Run Id
          description: Run identifier.
        case:
          additionalProperties: true
          type: object
          title: Case
          description: Full archived case row loaded from results.jsonl.
      type: object
      required:
      - run_id
      - case
      title: InspectorRunCaseDetailResponse
    InspectorRunDetailResponse:
      properties:
        summary:
          additionalProperties: true
          type: object
          title: Summary
          description: Raw summary.json payload for the run.
        experiment:
          additionalProperties: true
          type: object
          title: Experiment
          description: Raw experiment.json payload for the run when present.
        case_summaries:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Case Summaries
          description: Compact summaries for each archived case result in the run.
        results_preview:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Results Preview
          description: Preview of up to the first 10 lines from results.jsonl.
      type: object
      required:
      - summary
      - experiment
      title: InspectorRunDetailResponse
    InspectorRunSummaryResponse:
      properties:
        run_id:
          type: string
          title: Run Id
          description: Run identifier.
        directory:
          type: string
          title: Directory
          description: Directory name on disk for the run.
        path:
          type: string
          title: Path
          description: Server-local filesystem path to the run directory.
        name:
          type: string
          title: Name
          description: Human-friendly run name.
        suite:
          anyOf:
          - type: string
          - type: 'null'
          title: Suite
          description: Evaluation suite name when present.
        profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile
          description: Runtime profile used for the run.
        pipeline:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline
          description: Pipeline used for the run when present.
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Model name recorded for the run when present.
        cases_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cases Total
          description: Total number of evaluated cases when present.
        score:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          title: Score
          description: Primary score extracted from the run summary.
        assistant_turns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assistant Turns
          description: Assistant turn count recorded for the run when present.
        total_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Tokens
          description: Total token count recorded for the run when present.
        matrix_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Matrix Context
          description: Optional matrix metadata when the run came from a matrix evaluation.
        updated_at:
          type: number
          title: Updated At
          description: Last modification time of the summary file as a Unix timestamp.
      type: object
      required:
      - run_id
      - directory
      - path
      - name
      - updated_at
      title: InspectorRunSummaryResponse
    JobAcceptedResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Server-generated job identifier.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: Initial job state at submission time.
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Owning session identifier when the job was created from a session
            task.
      type: object
      required:
      - job_id
      - status
      title: JobAcceptedResponse
      example:
        job_id: job_123456789abc
        session_id: session_123456789abc
        status: pending
    JobStateResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Server-generated job identifier.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: Current job lifecycle state.
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Owning session identifier when the job belongs to a session.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the job record was created.
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
          description: When execution started.
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: When execution finished, whether successful or failed.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Failure message when the job ended in `failed` state.
        result:
          anyOf:
          - $ref: '#/components/schemas/RunResult'
          - type: 'null'
          description: Final run result when the job has completed successfully.
      type: object
      required:
      - job_id
      - status
      - created_at
      title: JobStateResponse
      example:
        completed_at: '2026-03-18T08:15:04Z'
        created_at: '2026-03-18T08:15:00Z'
        job_id: job_123456789abc
        result:
          content: The log shows a block allocation request with no obvious anomaly
            in the provided sample.
          events: []
          metadata: {}
          mode: agent
          profile: default
          prompt_variants:
            general_analyst: default
          tool_calls: []
        started_at: '2026-03-18T08:15:01Z'
        status: completed
    JobStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
      title: JobStatus
    JobSummaryResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Server-generated job identifier.
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Owning session identifier when the job belongs to a session.
        status:
          $ref: '#/components/schemas/JobStatus'
          description: Current job lifecycle state.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the job record was created.
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
          description: When execution started.
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
          description: When execution finished, whether successful or failed.
        task:
          type: string
          title: Task
          description: Task text from the submitted run request.
        profile:
          type: string
          title: Profile
          description: Profile used for the run request.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Failure message when the job ended in `failed` state.
        has_result:
          type: boolean
          title: Has Result
          description: Whether a completed result payload is currently available.
        storage_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Path
          description: Server-local path to the persisted job record when persistence
            is enabled.
      type: object
      required:
      - job_id
      - status
      - created_at
      - task
      - profile
      - has_result
      title: JobSummaryResponse
      example:
        completed_at: '2026-03-18T08:15:04Z'
        created_at: '2026-03-18T08:15:00Z'
        has_result: true
        job_id: job_123456789abc
        profile: hdfs_eval
        started_at: '2026-03-18T08:15:01Z'
        status: completed
        storage_path: /tmp/runs/jobs/job_123456789abc.json
        task: Explain what happened in session.log
    RunOverrides:
      properties:
        mode:
          anyOf:
          - $ref: '#/components/schemas/ExecutionMode'
          - type: 'null'
          description: Override the execution mode selected by the profile.
        pipeline:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline
          description: Override the pipeline name when running in pipeline mode.
        tools:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tools
          description: Replace the tool allowlist for this run.
          examples:
          - - read_file
            - search_text
        skills:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Skills
          description: Replace the active skills for this run.
          examples:
          - - generic-log-analysis
        prompt_overrides:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Prompt Overrides
          description: 'Map prompt roles to prompt variants, for example `general_analyst:
            default`.'
          examples:
          - general_analyst: default
        max_turns:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Turns
          description: Maximum assistant turns allowed for each agent loop.
          examples:
          - 4
        max_delegations:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Delegations
          description: Maximum delegations allowed in planner mode.
          examples:
          - 2
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
          description: Override the model provider for this run.
          examples:
          - openai
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Override the model name for this run.
          examples:
          - gpt-4o-mini
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: Override the model temperature for this run.
          examples:
          - 0.0
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: Override the model output token limit for this run.
          examples:
          - 4096
      type: object
      title: RunOverrides
      example:
        max_turns: 4
        prompt_overrides:
          general_analyst: default
    RunRequest:
      properties:
        task:
          type: string
          minLength: 1
          title: Task
          description: Natural-language task the runtime should perform.
          examples:
          - Explain what happened in session.log
        profile:
          type: string
          title: Profile
          description: Named runtime profile from the server configuration.
          default: default
          examples:
          - hdfs_eval
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactInput'
          type: array
          title: Artifacts
          description: Artifacts copied into the temporary workspace for the run.
        overrides:
          $ref: '#/components/schemas/RunOverrides'
          description: Per-request runtime overrides applied on top of the selected
            profile.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Opaque caller-supplied metadata preserved with the run and
            included in traces.
      type: object
      required:
      - task
      title: RunRequest
      example:
        artifacts:
        - content: '081111 061856 34 INFO dfs.FSNamesystem: BLOCK* NameSystem.allocateBlock:
            /tmp/x blk_1'
          name: session.log
        metadata:
          ticket: INC-42
        overrides:
          max_turns: 4
        profile: hdfs_eval
        task: Explain what happened in session.log
    RunResult:
      properties:
        content:
          type: string
          title: Content
          description: Final assistant output for the run.
        mode:
          $ref: '#/components/schemas/ExecutionMode'
          description: Resolved execution mode used for the run.
        profile:
          type: string
          title: Profile
          description: Resolved profile name used for the run.
        prompt_variants:
          additionalProperties:
            type: string
          type: object
          title: Prompt Variants
          description: Prompt variant chosen for each active role.
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCallRecord'
          type: array
          title: Tool Calls
          description: Structured record of tool calls captured during execution.
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Events
          description: Low-level execution events captured from the runtime.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Additional execution metadata, including the synthesized trace
            payload.
      type: object
      required:
      - content
      - mode
      - profile
      title: RunResult
      example:
        content: The log shows a block allocation request for /tmp/x with no obvious
          anomaly in the provided sample.
        events: []
        metadata:
          trace:
            request:
              task: Explain what happened in session.log
        mode: agent
        profile: default
        prompt_variants:
          general_analyst: default
        tool_calls: []
    SessionCreateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Optional human-friendly session name.
        profile:
          type: string
          title: Profile
          description: Default profile to use for tasks submitted through this session.
          default: default
          examples:
          - intent_demo
        overrides:
          $ref: '#/components/schemas/RunOverrides'
          description: Default runtime overrides merged into each task submitted through
            the session.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Opaque session metadata carried into future task metadata.
      type: object
      title: SessionCreateRequest
      example:
        metadata:
          customer: demo
          source_tool: freno-ui
        name: freno-demo
        overrides:
          max_turns: 4
        profile: intent_demo
    SessionResponse:
      properties:
        session_id:
          type: string
          title: Session Id
          description: Server-generated session identifier.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Optional human-friendly session name.
        profile:
          type: string
          title: Profile
          description: Default profile used for new tasks in this session.
        overrides:
          $ref: '#/components/schemas/RunOverrides'
          description: Default runtime overrides applied to new session tasks.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Opaque metadata stored with the session.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the session was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: When the session was last updated.
        storage_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Storage Path
          description: Server-local path to the persisted session record when persistence
            is enabled.
      type: object
      required:
      - session_id
      - profile
      - created_at
      - updated_at
      title: SessionResponse
      example:
        created_at: '2026-03-18T08:10:00Z'
        metadata:
          customer: demo
          source_tool: freno-ui
        name: freno-demo
        overrides:
          max_turns: 4
        profile: intent_demo
        session_id: session_123456789abc
        storage_path: /tmp/runs/sessions/session_123456789abc.json
        updated_at: '2026-03-18T08:10:00Z'
    SessionTaskRequest:
      properties:
        task:
          type: string
          minLength: 1
          title: Task
          description: Task to execute within the session context.
          examples:
          - Summarize what happened for intent Id392bc9f3ccb49f5989af6df730f940f
        profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile
          description: Optional per-task profile override. If omitted, the session
            default profile is used.
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactInput'
          type: array
          title: Artifacts
          description: Artifacts copied into the temporary workspace for this task.
        overrides:
          $ref: '#/components/schemas/RunOverrides'
          description: Per-task overrides merged on top of the session defaults.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Opaque task metadata merged with the session metadata.
      type: object
      required:
      - task
      title: SessionTaskRequest
      example:
        metadata:
          ticket: INC-42
        overrides:
          max_turns: 2
        task: Summarize what happened for intent Id392bc9f3ccb49f5989af6df730f940f
    SessionUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Replace the session name.
        profile:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile
          description: Replace the session's default profile for future tasks.
        overrides:
          anyOf:
          - $ref: '#/components/schemas/RunOverrides'
          - type: 'null'
          description: Partial override update merged into the existing session overrides.
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Metadata keys to merge into the existing session metadata.
      type: object
      title: SessionUpdateRequest
      example:
        metadata:
          team: ops
        overrides:
          max_turns: 6
        profile: hdfs_eval_zero_shot
    SubmitJobRequest:
      properties:
        run:
          $ref: '#/components/schemas/RunRequest'
          description: The run request to execute asynchronously.
      type: object
      required:
      - run
      title: SubmitJobRequest
      example:
        run:
          artifacts:
          - content: '081111 061856 34 INFO dfs.FSNamesystem: BLOCK* NameSystem.allocateBlock:
              /tmp/x blk_1'
            name: session.log
          profile: hdfs_eval
          task: Explain what happened in session.log
    ToolCallRecord:
      properties:
        name:
          type: string
          title: Name
          description: Tool name invoked during the run.
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
          description: Tool arguments after JSON decoding.
        result:
          title: Result
          description: Tool result captured in the execution trace.
      type: object
      required:
      - name
      title: ToolCallRecord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: health
  description: Lightweight service readiness and discovery endpoints.
- name: jobs
  description: Asynchronous run submission and polling endpoints.
- name: sessions
  description: Stateful session endpoints for repeated task submission.
- name: inspector
  description: Inspector-oriented endpoints for viewing persisted runs and API state.
